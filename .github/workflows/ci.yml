name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format:check
      - run: npm run api:types && git diff --exit-code apps/mobile/src/types/api.generated.ts
  backend:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      STORAGE_BACKEND: memory
      GEMINI_API_KEY: ""
      FIREBASE_PROJECT_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r backend/requirements.lock.txt
      - run: ruff check backend/app backend/tests scripts
      - run: ruff format --check backend/app backend/tests scripts
      - run: python -m pytest
        working-directory: backend
      - run: python scripts/export_openapi.py && git diff --exit-code docs/openapi.json
